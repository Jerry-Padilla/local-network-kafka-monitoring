[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "netpulse-query-api"
version = "0.1.0"
description = "Read-only daily reliability API for NetPulse"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "psycopg[binary,pool]==3.2.6",
  "pydantic==2.11.1",
  "structlog==25.2.0",
  "uvicorn==0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netpulse_query_api"]
