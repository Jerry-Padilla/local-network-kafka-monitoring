version: 2

updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/packages/*"
      - "/services/*"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
        group-by: dependency-name
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "netpulse-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
