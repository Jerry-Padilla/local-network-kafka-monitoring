name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest -m "not integration" --cov --cov-report=xml
      - run: alembic -c database/alembic.ini upgrade head --sql > /tmp/netpulse-migration.sql

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build event-ingestor network-agent simulator tests

  integration:
    runs-on: ubuntu-latest
    needs: [quality, containers]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait event-ingestor
      - run: docker compose --profile test run --rm -e NETPULSE_INTEGRATION=1 tests -p no:cacheprovider -m integration
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
