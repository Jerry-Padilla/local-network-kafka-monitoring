name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent-python313-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==8.3.5 ./packages/contracts ./packages/observability ./services/network-agent
      - run: python -m pip check
      - run: >-
          python -m pytest packages/contracts/tests services/network-agent/tests -q
          --ignore=packages/contracts/tests/test_json_schemas.py

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: python -m pytest -m "not integration" --cov --cov-report=xml
      - run: pytest tests/test_observability_config.py tests/test_observability_scripts.py -q
      - run: bash deployment/pi/tests/preflight_test.sh
      - run: alembic -c database/alembic.ini upgrade head --sql > /tmp/netpulse-migration.sql

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          database/init/00-create-app-user.sh
          database/init/01-create-monitoring-users.sh
          database/init/02-create-query-api-user.sh
          database/init/03-create-airflow-analytics-user.sh
          deployment/pi/bootstrap/first-boot.sh
          deployment/pi/bootstrap/tests/first_boot_test.sh
          deployment/pi/netpulse-pi-preflight.sh
          deployment/pi/tests/preflight_test.sh
          scripts/create_topics.sh
          scripts/netpulse.sh
          scripts/provision-monitoring-users.sh
      - run: docker compose --profile monitoring --profile streaming --profile classification --profile analytics --profile test config --quiet
      - run: docker compose --profile airflow config --quiet
      - run: docker run --rm -v "$PWD/deployment/observability/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml
      - run: docker run --rm -v "$PWD/deployment/observability/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.14.0 check rules /etc/prometheus/rules/recording.yml /etc/prometheus/rules/alerts.yml
      - run: docker compose --profile analytics build event-ingestor network-agent simulator stream-processor incident-classifier analytics tests
      - run: docker compose --profile airflow build airflow-scheduler airflow-fixture
      - run: >-
          docker compose --profile airflow run --rm --no-deps airflow-scheduler
          python -c "from airflow.models import DagBag; bag = DagBag('/opt/airflow/dags'); assert not bag.import_errors, bag.import_errors"

  integration:
    runs-on: ubuntu-24.04
    needs: [quality, containers]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait event-ingestor
      - run: docker compose --profile test run --rm -e NETPULSE_INTEGRATION=1 tests -p no:cacheprovider -m "integration and not api_integration and not host_integration"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  streaming-integration:
    runs-on: ubuntu-24.04
    needs: [quality, containers]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait event-ingestor
      - run: docker compose --profile demo run --rm simulator run --scenario healthy --duration 2 --seed 42
      - run: docker compose --profile demo run --rm simulator run --scenario malformed-events --duration 1 --seed 43
      - run: docker compose --profile streaming run --rm -e NETPULSE_STREAM_TRIGGER_MODE=available-now stream-processor
      - run: docker compose --profile test run --rm --entrypoint python tests scripts/verify_streaming.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  classification-integration:
    runs-on: ubuntu-24.04
    needs: [quality, containers]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/netpulse.sh classifier-verify
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  analytics-integration:
    runs-on: ubuntu-24.04
    needs: [quality, containers]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait event-ingestor
      - run: docker compose --profile demo run --rm simulator run --scenario healthy --duration 2 --seed 42
      - run: ./scripts/netpulse.sh analytics-verify
      - run: ./scripts/netpulse.sh tableau-export
      - run: python scripts/verify_tableau_export.py tableau_exports
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  query-api-integration:
    runs-on: ubuntu-24.04
    needs: [quality, containers]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ./scripts/netpulse.sh api-integration
      - run: ./scripts/netpulse.sh api-provisioning-test
      - run: ./scripts/netpulse.sh api-verify
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  airflow-integration:
    runs-on: ubuntu-24.04
    needs: [quality, containers]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/netpulse.sh airflow-verify
      - if: always()
        run: docker compose --profile airflow logs --no-color
      - if: always()
        run: docker compose --profile airflow down --volumes

  observability-integration:
    runs-on: ubuntu-24.04
    needs: [quality, containers]
    timeout-minutes: 25
    env:
      GRAFANA_ADMIN_PASSWORD: change-me-local-grafana-admin
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/netpulse.sh monitoring-up
      - run: docker compose --profile demo run --rm simulator run --scenario healthy --duration 2 --seed 42
      - name: Verify provisioned observability stack
        run: |
          for attempt in {1..12}; do
            if ./scripts/netpulse.sh monitoring-verify; then
              exit 0
            fi
            echo "Observability is not ready (attempt $attempt/12)"
            sleep 5
          done
          exit 1
      - if: always()
        run: docker compose --profile monitoring logs --no-color
      - if: always()
        run: docker compose --profile monitoring down --volumes
