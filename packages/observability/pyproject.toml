[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "netpulse-observability"
version = "0.1.0"
description = "Shared Prometheus HTTP lifecycle support for NetPulse services"
requires-python = ">=3.12,<3.14"
dependencies = [
  "prometheus-client==0.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netpulse_observability"]
