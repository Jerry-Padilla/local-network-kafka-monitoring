[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "netpulse-contracts"
version = "0.1.0"
description = "Versioned event contracts shared by NetPulse services"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema==4.26.0",
  "pydantic==2.11.1",
  "structlog==25.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netpulse_contracts"]
