name: netpulse

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netpulse}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-netpulse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-local-admin}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-change-me-local-app}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD:-change-me-local-grafana}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-change-me-local-exporter}
      QUERY_API_POSTGRES_PASSWORD: ${QUERY_API_POSTGRES_PASSWORD:-change-me-local-query-api}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER:-netpulse_admin} -d ${POSTGRES_DB:-netpulse}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  kafka:
    image: apache/kafka:4.2.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_LAN_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    ports:
      - "${KAFKA_EXTERNAL_BIND_ADDRESS:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
    restart: unless-stopped
    networks: [backend]

  topic-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./scripts/create_topics.sh:/scripts/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    restart: "no"
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: services/event-ingestor/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NETPULSE_ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_ADMIN_USER:-netpulse_admin}:${POSTGRES_ADMIN_PASSWORD:-change-me-local-admin}@postgres:5432/${POSTGRES_DB:-netpulse}
    entrypoint: ["alembic", "-c", "database/alembic.ini"]
    command: ["upgrade", "head"]
    restart: "no"
    networks: [backend]

  event-ingestor:
    build:
      context: .
      dockerfile: services/event-ingestor/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NETPULSE_DATABASE_URL: postgresql://netpulse_app:${POSTGRES_APP_PASSWORD:-change-me-local-app}@postgres:5432/${POSTGRES_DB:-netpulse}
      NETPULSE_CONSUMER_GROUP: ${NETPULSE_CONSUMER_GROUP:-netpulse-ingestion-v1}
      NETPULSE_LOG_LEVEL: ${NETPULSE_LOG_LEVEL:-INFO}
      NETPULSE_METRICS_ENABLED: "true"
      NETPULSE_METRICS_HOST: 0.0.0.0
      NETPULSE_METRICS_PORT: "9101"
    restart: unless-stopped
    networks: [backend]

  simulator:
    profiles: [demo]
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    depends_on:
      event-ingestor:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NETPULSE_SIMULATOR_SEED: ${NETPULSE_SIMULATOR_SEED:-42}
      NETPULSE_LOG_LEVEL: ${NETPULSE_LOG_LEVEL:-INFO}
    networks: [backend]

  network-agent:
    profiles: [agent]
    build:
      context: .
      dockerfile: services/network-agent/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NETPULSE_OUTBOX_PATH: /var/lib/netpulse-agent/outbox.db
      NETPULSE_METRICS_ENABLED: "true"
      NETPULSE_METRICS_HOST: 0.0.0.0
      NETPULSE_METRICS_PORT: "9102"
    volumes:
      - ./config/agent-docker.yaml:/etc/netpulse-agent/agent.yaml:ro
      - agent-outbox:/var/lib/netpulse-agent
    restart: unless-stopped
    networks: [backend]

  stream-processor:
    profiles: [streaming]
    build:
      context: .
      dockerfile: services/stream-processor/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NETPULSE_DATABASE_URL: postgresql://netpulse_app:${POSTGRES_APP_PASSWORD:-change-me-local-app}@postgres:5432/${POSTGRES_DB:-netpulse}
      NETPULSE_STREAM_SOURCE_TOPIC: network.measurements.raw.v1
      NETPULSE_STREAM_STARTING_OFFSETS: ${NETPULSE_STREAM_STARTING_OFFSETS:-earliest}
      NETPULSE_STREAM_FAIL_ON_DATA_LOSS: "true"
      NETPULSE_STREAM_CHECKPOINT_ROOT: /var/lib/netpulse-streaming/checkpoints
      NETPULSE_STREAM_WATERMARK_DELAY: ${NETPULSE_STREAM_WATERMARK_DELAY:-15 minutes}
      NETPULSE_STREAM_TRIGGER_MODE: ${NETPULSE_STREAM_TRIGGER_MODE:-processing-time}
      NETPULSE_STREAM_TRIGGER_INTERVAL: ${NETPULSE_STREAM_TRIGGER_INTERVAL:-10 seconds}
      NETPULSE_STREAM_SHUFFLE_PARTITIONS: ${NETPULSE_STREAM_SHUFFLE_PARTITIONS:-6}
      NETPULSE_LOG_LEVEL: ${NETPULSE_LOG_LEVEL:-INFO}
      NETPULSE_METRICS_ENABLED: "true"
      NETPULSE_METRICS_HOST: 0.0.0.0
      NETPULSE_METRICS_PORT: "9103"
    volumes:
      - spark-checkpoints:/var/lib/netpulse-streaming/checkpoints
      - spark-ivy-cache:/var/lib/netpulse-streaming/.ivy2
    restart: unless-stopped
    networks: [backend]

  incident-classifier:
    profiles: [classification]
    build:
      context: .
      dockerfile: services/incident-classifier/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NETPULSE_DATABASE_URL: postgresql://netpulse_app:${POSTGRES_APP_PASSWORD:-change-me-local-app}@postgres:5432/${POSTGRES_DB:-netpulse}
      NETPULSE_CLASSIFIER_LOOKBACK_SECONDS: ${NETPULSE_CLASSIFIER_LOOKBACK_SECONDS:-60}
      NETPULSE_CLASSIFIER_INTERVAL_SECONDS: ${NETPULSE_CLASSIFIER_INTERVAL_SECONDS:-10}
      NETPULSE_CLASSIFIER_MINIMUM_SAMPLES: ${NETPULSE_CLASSIFIER_MINIMUM_SAMPLES:-2}
      NETPULSE_CLASSIFIER_OPEN_OBSERVATIONS: ${NETPULSE_CLASSIFIER_OPEN_OBSERVATIONS:-2}
      NETPULSE_CLASSIFIER_RESOLVE_OBSERVATIONS: ${NETPULSE_CLASSIFIER_RESOLVE_OBSERVATIONS:-2}
      NETPULSE_LOG_LEVEL: ${NETPULSE_LOG_LEVEL:-INFO}
      NETPULSE_METRICS_ENABLED: "true"
      NETPULSE_METRICS_HOST: 0.0.0.0
      NETPULSE_METRICS_PORT: "9104"
    restart: unless-stopped
    networks: [backend]

  analytics:
    profiles: [analytics]
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NETPULSE_DATABASE_URL: postgresql://netpulse_app:${POSTGRES_APP_PASSWORD:-change-me-local-app}@postgres:5432/${POSTGRES_DB:-netpulse}
      NETPULSE_LOG_LEVEL: ${NETPULSE_LOG_LEVEL:-INFO}
    restart: "no"
    networks: [backend]

  query-api-init:
    profiles: [api]
    image: postgres:17.10-bookworm
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-netpulse}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-netpulse_admin}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-local-admin}
      QUERY_API_POSTGRES_PASSWORD: ${QUERY_API_POSTGRES_PASSWORD:-change-me-local-query-api}
    volumes:
      - ./database/init/02-create-query-api-user.sh:/scripts/provision-query-api-user.sh:ro
    entrypoint: ["bash", "/scripts/provision-query-api-user.sh"]
    restart: "no"
    networks: [backend]

  query-api:
    profiles: [api]
    build:
      context: .
      dockerfile: services/query-api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      query-api-init:
        condition: service_completed_successfully
    environment:
      NETPULSE_DATABASE_URL: postgresql://netpulse_query_api:${QUERY_API_POSTGRES_PASSWORD:-change-me-local-query-api}@postgres:5432/${POSTGRES_DB:-netpulse}
      NETPULSE_QUERY_API_POOL_MIN_SIZE: ${NETPULSE_QUERY_API_POOL_MIN_SIZE:-1}
      NETPULSE_QUERY_API_POOL_MAX_SIZE: ${NETPULSE_QUERY_API_POOL_MAX_SIZE:-5}
      NETPULSE_QUERY_API_POOL_ACQUIRE_TIMEOUT_SECONDS: ${NETPULSE_QUERY_API_POOL_ACQUIRE_TIMEOUT_SECONDS:-2.0}
      NETPULSE_QUERY_API_STATEMENT_TIMEOUT_MS: ${NETPULSE_QUERY_API_STATEMENT_TIMEOUT_MS:-3000}
      NETPULSE_QUERY_API_LOG_LEVEL: ${NETPULSE_QUERY_API_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [backend]

  monitoring-init:
    profiles: [monitoring]
    image: postgres:17.10-bookworm
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-netpulse}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-netpulse_admin}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-local-admin}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD:-change-me-local-grafana}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-change-me-local-exporter}
    volumes:
      - ./database/init/01-create-monitoring-users.sh:/scripts/provision-monitoring-users.sh:ro
    entrypoint: ["bash", "/scripts/provision-monitoring-users.sh"]
    restart: "no"
    networks: [backend]

  postgres-exporter:
    profiles: [monitoring]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-netpulse}?sslmode=disable
      DATA_SOURCE_USER: netpulse_postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-change-me-local-exporter}
    restart: unless-stopped
    networks: [backend]

  kafka-exporter:
    profiles: [monitoring]
    image: danielqsj/kafka-exporter:v1.10.0
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:9092"]
    restart: unless-stopped
    networks: [backend]

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deployment/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test:
        [
          "CMD",
          "/bin/amtool",
          "--alertmanager.url=http://localhost:9093",
          "alert",
          "query"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.14.0
    depends_on:
      alertmanager:
        condition: service_healthy
      kafka-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployment/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/observability/prometheus/pi-targets.json:/etc/prometheus/pi-targets.json:ro
      - ./deployment/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.2
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-grafana-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD:-change-me-local-grafana}
      POSTGRES_DB: ${POSTGRES_DB:-netpulse}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deployment/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    networks: [backend]

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NETPULSE_DATABASE_URL: postgresql://netpulse_app:${POSTGRES_APP_PASSWORD:-change-me-local-app}@postgres:5432/${POSTGRES_DB:-netpulse}
      NETPULSE_ADMIN_DATABASE_URL: postgresql://netpulse_admin:${POSTGRES_ADMIN_PASSWORD:-change-me-local-admin}@postgres:5432/${POSTGRES_DB:-netpulse}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD:-change-me-local-grafana}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-change-me-local-exporter}
    volumes:
      - .:/workspace
    networks: [backend]

networks:
  backend:
    internal: false

volumes:
  agent-outbox:
  alertmanager-data:
  grafana-data:
  kafka-data:
  postgres-data:
  prometheus-data:
  spark-checkpoints:
  spark-ivy-cache:
